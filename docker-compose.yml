services:
  astro-app:
    build: .
    container_name: core_mind_app
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astro.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.astro.entrypoints=${ENTRYPOINT}"
      #- "traefik.http.routers.astro.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.astro.loadbalancer.server.port=80"

networks:
  web:
    external: true
